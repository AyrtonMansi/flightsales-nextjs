name: One-off security dependency upgrade

on:
  push:
    paths:
      - '.github/workflows/security-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Move to patched Active-LTS framework line
        run: |
          npm install --save-exact next@16.3.3 react@19.2.0 react-dom@19.2.0 @vercel/og@1.0.0
          npm install --save-dev --save-exact eslint@9 eslint-config-next@16.3.3 @types/react@19 @types/react-dom@19
          npm pkg set scripts.lint="eslint src"
          npm audit fix --omit=dev || true
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit generated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
          else
            git commit -m "Upgrade to patched Next.js active LTS"
            git push origin HEAD:main
          fi
